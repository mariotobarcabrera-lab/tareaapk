name: Compilar APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: npm install

      - name: Preparar la web (www/)
        run: npm run build:web

      - name: Crear el proyecto Android
        run: npx cap add android

      - name: Permisos de Android
        run: python3 patch_android.py

      - name: Iconos de la app
        continue-on-error: true
        run: |
          mkdir -p assets
          cp icon-only.png assets/icon-only.png
          npx capacitor-assets generate --android --iconBackgroundColor "#0a0a0a" --iconBackgroundColorDark "#0a0a0a"

      - name: Sincronizar
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: tareas-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
